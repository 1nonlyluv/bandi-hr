name: Deploy Bandi Program Webapp

"on":
  push:
    branches:
      - main
    paths:
      - "bandi_program/webapp/**"
      - "bandi_program/*.xlsx"
      - "bandi_program/data/generated/program_schedule_week*.json"
      - "bandi_program/data/generated/program_schedule_workbook_*.json"
      - "bandi_program/build_program_schedule_workbook_jsons.py"
      - "bandi_program/build_program_schedule_bundle.py"
      - "bandi_program/program_schedule_parser.py"
      - "bandi_program/program_schedule_normalizer.py"
      - "bandi_program/write_webapp_version.py"
      - ".github/workflows/deploy-bandi-program-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-bandi-program"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build workbook week JSONs
        working-directory: bandi_program
        run: |
          python3 build_program_schedule_workbook_jsons.py \
            "주간프로그램 계획표(2026).xlsx" \
            --output-dir data/generated

      - name: Build webapp bundle
        working-directory: bandi_program
        run: |
          python3 build_program_schedule_bundle.py \
            "data/generated/program_schedule_week[0-9]*.json" \
            "data/generated/program_schedule_workbook_*.json" \
            --output webapp/assets/program_schedule.json

      - name: Write webapp version
        working-directory: bandi_program
        run: |
          python3 write_webapp_version.py \
            --output webapp/assets/version.json \
            --version "${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bandi_program/webapp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
